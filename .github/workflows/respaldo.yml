name: Copia del registro
on:
  schedule: [{ cron: "0 6 * * 1" }]   # cada lunes
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npx hardhat run scripts/exportar.js --network base
        env:
          CONTRATO: "0x8c6ACA8E53BaA96627DFF40552B5f328dCA8F230"
      - name: Guardar copia
        run: |
          cp "$(ls -t respaldo/registro-*.json | head -1)" respaldo/ultimo.json
          git config user.name "copia-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add respaldo
          git diff --cached --quiet || git commit -m "Copia del registro $(date -u +%F)"
          git push
      - name: Revisar saldo del patrocinador
        id: saldo
        continue-on-error: true
        run: npx hardhat run scripts/saldo.js --network base
      - name: Avisar si el saldo esta bajo
        if: steps.saldo.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --title "El patrocinador del gas se está quedando sin ETH" \
            --body "A la billetera NN (0xd72BDA565C01B0202B6691c32179763539fBe55e) le quedan $(cat saldo.txt) ETH en Base. Mándale un poco de ETH en la red Base para que las invitaciones sigan funcionando." \
            --assignee "${{ github.repository_owner }}"
