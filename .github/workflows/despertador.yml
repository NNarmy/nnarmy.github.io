name: Mantener despierto al patrocinador
# Render (plan gratis) duerme el servidor tras 15 minutos sin uso. Este toque cada 10 minutos lo mantiene despierto.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tocar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 90 https://movimiento-patrocinador.onrender.com/ || true
