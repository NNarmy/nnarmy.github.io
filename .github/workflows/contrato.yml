name: Desplegar contrato
on:
  workflow_dispatch:
    inputs:
      accion: { description: "desplegar o fundador", default: "desplegar", required: true }
      red: { description: "base (real) o baseSepolia (pruebas)", default: "base", required: true }
      contrato: { description: "Solo para 'fundador': dirección del contrato ya publicado", required: false }
      fundador: { description: "Dirección del #1313 (se ve en Mi número)", required: false }
      guardian: { description: "Billetera guardián de ian", default: "0x08EdCa6b1c4300Ae00F185CbB1e00945734Eaf9C", required: false }
jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npx hardhat test
      - name: Ejecutar
        run: npx hardhat run scripts/${{ inputs.accion == 'fundador' && 'fundador' || 'deploy' }}.js --network ${{ inputs.red }}
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          MNEMONIC: ${{ secrets.MNEMONIC }}
          CONTRATO: ${{ inputs.contrato }}
          FUNDADOR: ${{ inputs.fundador }}
          GUARDIAN: ${{ inputs.guardian }}
