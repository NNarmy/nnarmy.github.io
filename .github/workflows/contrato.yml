name: Desplegar contrato
on:
  workflow_dispatch:
    inputs:
      red: { description: "baseSepolia o base", default: "baseSepolia", required: true }
      fundador: { description: "Dirección del #1313 (se ve en Mi número). Vacío = se registra después", required: false }
jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npx hardhat test
      - run: npx hardhat run scripts/deploy.js --network ${{ inputs.red }}
        env:
          # Llave SOLO de pruebas, a la vista a proposito por velocidad. Para la red real usar el secreto PRIVATE_KEY.
          PRIVATE_KEY: ${{ inputs.red == 'base' && secrets.PRIVATE_KEY || '0x192d54e340cf005efb5fa980a936572359d05e5c0cca70b00ebe4cbb2fb31d18' }}
          FUNDADOR: ${{ inputs.fundador }}
          GUARDIAN: ${{ inputs.fundador }}
